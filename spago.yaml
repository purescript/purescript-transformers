package:
  name: transformers
  description: Monad and comonad transformers based on mtl
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 6.1.1
    license: BSD-3-Clause
    location:
      githubOwner: purescript
      githubRepo: purescript-transformers
  dependencies:
    - control: ">=6.0.0 <7.0.0"
    - distributive: ">=6.0.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.0.0 <7.0.0"
    - exceptions: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - identity: ">=6.0.0 <7.0.0"
    - lazy: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - st: ">=6.2.0 <7.0.0"
    - tailrec: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - unfoldable: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies:
      - arrays: ">=7.0.0 <8.0.0"
      - console: ">=6.0.0 <7.0.0"
      - partial: ">=4.0.0 <5.0.0"
workspace: {}
